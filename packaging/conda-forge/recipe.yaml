context:
  name: zfls
  version: "0.1.2"
  # The zigwin32 package rstd's build.zig.zon pins (Windows builds only):
  # its commit, and the Zig package hash naming its directory in zig-pkg/
  zigwin32_commit: 65cb93421729e89c0acc99f90550e8ad0e6ceb87
  zigwin32_hash: win32-32.0.17-preview-mX5pFV2k5QN3LlWB1QQWEJv6wltK3Eq5Nn-ZDa_2_Na6
  # The M_intrinsics package build.zig.zon pins (the intrinsic procedure
  # documentation): its commit, archive checksum and Zig package hash;
  # .github/workflows/m-intrinsics.yml keeps them in step with build.zig.zon
  m_intrinsics_commit: fc14233036d910e3678d350efc24609e11475067
  m_intrinsics_sha256: f7312d8fb3428bbc5d2eed3c0f775addf430e1da4073ff730cd59acf6c621596
  m_intrinsics_hash: N-V-__8AAI66bgG_VvNv_AuQWE5cmXjI4WPplnwamTROarDS

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # zfls with its vendor/rstd submodule (GitHub's own archives leave
  # submodules out), attached to every release
  - url: https://github.com/cesiumlang/zfls/releases/download/v${{ version }}/zfls-v${{ version }}-src.tar.gz
    sha256: a165c29498192dbc35307b301dd861ef07272f5a53c615ecba4d614d321f7182
  # Zig would otherwise download it during the build; unpacked where Zig
  # looks for a project's packages
  - if: win
    then:
      url: https://github.com/marlersoft/zigwin32/archive/${{ zigwin32_commit }}.tar.gz
      sha256: 430b1ba180c033d92f2b9a8070d288cc2394948a64867e1f05ec5e5f32d22edb
      target_directory: zig-pkg/${{ zigwin32_hash }}
  - url: https://github.com/urbanjost/M_intrinsics/archive/${{ m_intrinsics_commit }}.tar.gz
    sha256: ${{ m_intrinsics_sha256 }}
    target_directory: zig-pkg/${{ m_intrinsics_hash }}

build:
  number: 0

requirements:
  build:
    - zig 0.17.*
    # zfls is statically linked and uses no C library; on macOS this is
    # what records the minimum macOS version it is built for
    - if: osx
      then: ${{ stdlib('c') }}

tests:
  - script:
      - python -c "import subprocess, sys; v = subprocess.run(['zfls', '--version'], capture_output=True, text=True).stdout.strip(); print(v); sys.exit(v != '${{ version }}')"
      - python -c "import subprocess, sys; sys.exit(subprocess.run(['zfls', '--help'], capture_output=True).returncode)"
    requirements:
      run:
        - python

about:
  homepage: https://github.com/cesiumlang/zfls
  repository: https://github.com/cesiumlang/zfls
  summary: Fortran language server; a native Zig implementation of fortls
  description: |
    zfls is a Fortran language server (LSP) written in Zig: a native,
    dependency-free reimplementation of fortls with the same features and
    command-line options. It provides completion, hover, go to definition,
    references, rename, signature help and diagnostics for Fortran code.
  license: MIT
  license_file:
    - LICENSE
    - vendor/rstd/LICENSE
    - zig-pkg/${{ m_intrinsics_hash }}/LICENSE
    - if: win
      then: zig-pkg/${{ zigwin32_hash }}/LICENSE

extra:
  recipe-maintainers:
    - emanspeaks
