# Written by zfls's `zig build conda-recipe` (build/conda_recipe.zig) from
# its packaging/conda-forge/recipe.yaml, where the values of this context
# that come from elsewhere are left empty (""): those of the zfls source
# archive, and the Zig packages zfls's build.zig.zon files pin, which the
# build would otherwise download
context:
  name: zfls
  version: ""
  zfls_sha256: ""
  # rstd's Win32 bindings (Windows builds only): the GitHub repository and
  # commit, the checksum of GitHub's archive of it, and the Zig package hash
  # naming its directory in zig-pkg/
  zigwin32_repo: ""
  zigwin32_commit: ""
  zigwin32_sha256: ""
  zigwin32_hash: ""
  # M_intrinsics, the intrinsic procedure documentation zfls embeds, likewise
  m_intrinsics_repo: ""
  m_intrinsics_commit: ""
  m_intrinsics_sha256: ""
  m_intrinsics_hash: ""

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # zfls with its vendor/rstd submodule (GitHub's own archives leave
  # submodules out), attached to every release
  - url: https://github.com/cesiumlang/zfls/releases/download/v${{ version }}/zfls-v${{ version }}-src.tar.gz
    sha256: ${{ zfls_sha256 }}
  # unpacked where Zig looks for a project's packages
  - if: win
    then:
      url: https://github.com/${{ zigwin32_repo }}/archive/${{ zigwin32_commit }}.tar.gz
      sha256: ${{ zigwin32_sha256 }}
      target_directory: zig-pkg/${{ zigwin32_hash }}
  - url: https://github.com/${{ m_intrinsics_repo }}/archive/${{ m_intrinsics_commit }}.tar.gz
    sha256: ${{ m_intrinsics_sha256 }}
    target_directory: zig-pkg/${{ m_intrinsics_hash }}

build:
  number: 0

requirements:
  build:
    - zig 0.17.*
    # zfls is statically linked and uses no C library; on macOS this is
    # what records the minimum macOS version it is built for
    - if: osx
      then: ${{ stdlib('c') }}

tests:
  - package_contents:
      bin:
        - zfls
  - script:
      - zfls --help
      - zfls --version
      # a released zfls reports exactly its version
      - if: unix
        then: test "$(zfls --version)" = "${{ version }}"
        else: for /f "delims=" %%v in ('zfls --version') do if not "%%v"=="${{ version }}" exit 1

about:
  homepage: https://github.com/cesiumlang/zfls
  repository: https://github.com/cesiumlang/zfls
  summary: Fortran language server; a native Zig implementation of fortls
  description: |
    zfls is a Fortran language server (LSP) written in Zig: a native,
    dependency-free reimplementation of fortls with the same features and
    command-line options. It provides completion, hover, go to definition,
    references, rename, signature help and diagnostics for Fortran code.
  license: MIT
  license_file:
    - LICENSE
    - vendor/rstd/LICENSE
    - zig-pkg/${{ m_intrinsics_hash }}/LICENSE
    - if: win
      then: zig-pkg/${{ zigwin32_hash }}/LICENSE

extra:
  recipe-maintainers:
    - emanspeaks
