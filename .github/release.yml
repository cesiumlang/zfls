# Sections of the release notes GitHub generates for each release (the
# release job sets generate_release_notes). A pull request goes in the first
# section whose label it has.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Performance
      labels:
        - performance
    - title: Tests
      labels:
        - tests
    - title: Internal changes
      labels:
        - refactor
    - title: CI and packaging
      labels:
        - ci
    - title: Other changes
      labels:
        - "*"
