# Sections of each release's notes (build/release_notes.zig, #979): a pull
# request or an issue goes in the first section whose label it has.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Performance
      labels:
        - performance
    - title: Tests
      labels:
        - tests
    - title: Internal changes
      labels:
        - refactor
        - housekeeping
    - title: CI and packaging
      labels:
        - ci
    - title: Other changes
      labels:
        - "*"
