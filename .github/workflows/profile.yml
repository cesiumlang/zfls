name: Profile

# Where the server spends its time on Linux, on the corpora of the oracles
# (LAPACK, OpenBLAS, numpy), through the benchmark driver's session: the
# index of a cold workspace, the start from the index cache, requests,
# incremental edits and saves, one scenario at a time
# (tests/profile/run.sh). Two profilers: perf (sampled, call graphs from
# frame pointers) and callgrind (instruction counts, deterministic, on the
# LAPACK and OpenBLAS corpora; it makes the server 50 times slower).
# Their reports are the artifacts: perf report (exclusive and inclusive),
# folded stacks, callgrind_annotate. Start it by hand (`gh workflow run
# profile.yml --ref BRANCH`); not a gate of anything.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.1
  # valgrind has no AVX-512: the build targets x86-64-v2
  BUILD_TARGET: -Dtarget=x86_64-linux-gnu -Dcpu=x86_64_v2

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: ${{ matrix.tool }} ${{ matrix.corpus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tool: [perf, callgrind]
        corpus: [lapack, openblas, numpy]
        exclude:
          - tool: callgrind
            corpus: numpy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: randyos-org/setup-zig@bd9719185e5350e25dfaed832f37f7e869f47469 # node24 branch: v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Profilers
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          valgrind --version
          perf --version

      - name: Fetch dependencies
        run: |
          for wait in 15 30 60 120; do
            zig build --fetch && exit 0
            echo "::warning::fetching dependencies failed; retrying in ${wait}s"
            sleep "$wait"
          done
          zig build --fetch

      # safe, as released; frame pointers and debug info for the profilers
      - name: Build
        run: zig build -Doptimize=safe -Dprofile=true $BUILD_TARGET bin profile-bins

      - name: Corpus
        run: |
          case "${{ matrix.corpus }}" in
            lapack)
              git clone --depth 1 --branch v3.12.0 https://github.com/Reference-LAPACK/lapack _corpus
              echo "WORKSPACE=_corpus/SRC" >> "$GITHUB_ENV" ;;
            openblas)
              git clone --depth 1 --branch v0.3.27 https://github.com/OpenMathLib/OpenBLAS _corpus
              echo "WORKSPACE=_corpus/lapack-netlib/SRC" >> "$GITHUB_ENV" ;;
            numpy)
              git clone --depth 1 --branch v2.0.0 https://github.com/numpy/numpy _corpus
              echo "WORKSPACE=_corpus" >> "$GITHUB_ENV" ;;
          esac

      - name: Profile
        run: |
          chmod +x tests/profile/*.sh
          scale=2
          [ "${{ matrix.tool }}" = callgrind ] && scale=1
          sh tests/profile/run.sh "${{ matrix.tool }}" "$WORKSPACE" profile-out "$scale"

      - name: Reports
        if: always()
        run: sh tests/profile/report.sh profile-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ matrix.tool }}-${{ matrix.corpus }}
          path: |
            profile-out/**/*.txt
          if-no-files-found: ignore
