# A rehearsal of the release's checksums, GPG signature and attestations on
# the archives of an earlier CI run, publishing nothing: no tag, no release.
# Runs when this file is pushed on the signing branch; deleted before the
# branch merges.
name: Release rehearsal

on:
  push:
    branches: [issue-766-767-signing]
    paths: [.github/workflows/release-rehearsal.yml]

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

env:
  # a finished CI run with a dist artifact
  DIST_RUN: "45730185340"

jobs:
  rehearse:
    name: Rehearse the release's signing and attestations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ env.DIST_RUN }}
          github-token: ${{ github.token }}

      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          wc -l dist/SHA256SUMS

      # temporary: why the signing fails on the runner (never the secrets)
      - name: Diagnose GnuPG
        env:
          P: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          K: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/diag"
          mkdir -m 700 "$GNUPGHOME"
          gpg --version | head -1
          echo "$K" | base64 --decode | gpg --batch --import 2>&1 | tail -2
          gpg -K --keyid-format long 2>&1 | head -8
          printf '%s' "$P" > "$RUNNER_TEMP/p"
          echo x > "$RUNNER_TEMP/x"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/p" -vv --detach-sign -o "$RUNNER_TEMP/x.sig" "$RUNNER_TEMP/x" 2>&1 | tail -15 || true
          echo "--- with a trailing newline:"
          printf '%s\n' "$P" > "$RUNNER_TEMP/p2"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/p2" --detach-sign -o "$RUNNER_TEMP/x2.sig" "$RUNNER_TEMP/x" 2>&1 | tail -3 || true
          ls "$RUNNER_TEMP"/x*.sig 2>&1 | head

      - uses: ./.github/actions/release-integrity
        with:
          sign: ${{ vars.RELEASE_GPG_SIGNING }}
          attest: ${{ vars.RELEASE_ATTESTATIONS }}
          gpg-key: ${{ secrets.RELEASE_GPG_KEY }}
          gpg-passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Verify an attestation, as a user would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/zfls-v0.5.0-x86_64-windows.zip --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: rehearsal
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          if-no-files-found: error
