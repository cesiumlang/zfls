name: CI

# Every pull request and every push to main or dev is built and tested on all
# supported platforms, and the tests run on the release binaries themselves.
#
# Versions: build.zig.zon holds the version the next release will have. The
# release binaries are built once and packaged without the
# `zfls.prerelease` file the build installs next to them; the tests put it
# back, so under test a binary reports a release candidate (`0.1.1-rc`).
# When a push to main passes on every platform, the same archives are
# published as release v0.1.1 (where, without the file, the binary reports
# `0.1.1`), and the tested commit is tagged. Changes are collected on the
# dev branch (pull requests target it) and released by merging dev into main.
# After a release, main is merged back into dev, where build.zig.zon is bumped
# to the next patch version; main keeps the released version. For a minor or
# major release, set the version in build.zig.zon on dev by hand. main takes
# no direct pushes; a push to main whose version is already tagged is tested
# but not released.
#
# Reuse: every run records the git tree it built (`tested-tree`). A release
# from main publishes the archives of a passed pull request run that built
# exactly the same tree, with the same version, instead of building and
# testing them again; without one (main moved on after the pull request ran,
# a direct push, expired artifacts) it builds and tests them itself.

on:
  push:
    # dev is tested too, so a bad combination of merged pull requests shows
    # up at once (it is never released from there)
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.17.0
  # The fortls commit the parity, differential and stress tests run against
  FORTLS_REPO: fortran-lang/fortls
  FORTLS_REF: a94898dd852f06aa2eb72ff34e00caad3142efd0
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      sha: ${{ steps.ver.outputs.sha }}
      tree: ${{ steps.ver.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          read_version() { sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon; }
          version=$(read_version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read a MAJOR.MINOR.PATCH .version from build.zig.zon (got '$version')"
            exit 1
          fi
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          next_patch() { IFS=. read -r ma mi pa <<< "$1"; echo "$ma.$mi.$((pa + 1))"; }

          on_main=false
          if [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/main ]; then
            on_main=true
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              # main moved on: the run for the newer commit releases it all
              echo "main has moved past this commit; testing only" | tee -a "$GITHUB_STEP_SUMMARY"
              on_main=stale
            fi
          fi

          # Only changes outside .github/workflows/exempt.txt make a release;
          # CI's own commits (version bumps, marked [skip ci]) do not count
          base=$(git tag --sort=-version:refname | head -1)
          if [ -n "$base" ]; then
            changed=$(git log --format= --name-only --invert-grep --grep='\[skip ci\]' "$base..HEAD" | sort -u)
          else
            changed=$(git ls-files)
          fi
          mapfile -t patterns < <(grep -v '^\s*#' .github/workflows/exempt.txt | grep -v '^\s*$')
          releasable=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            exempt=false
            for pat in "${patterns[@]}"; do
              # shellcheck disable=SC2254
              case "$f" in $pat) exempt=true; break ;; esac
            done
            if [ "$exempt" = false ]; then releasable=true; break; fi
          done <<< "$changed"

          release=false
          [ "$on_main" = true ] && [ "$releasable" = true ] && release=true

          # whether the binaries are built from the checked-out tree as it is
          as_checked_out=true
          if tagged "$version"; then
            next=$(next_patch "$version")
            while tagged "$next"; do next=$(next_patch "$next"); done
            sed -i -E "s/^(\s*\.version = \")[^\"]+(\",)/\1$next\2/" build.zig.zon
            as_checked_out=false
            if [ "$release" = true ]; then
              # main takes no pushes, and dev is bumped after each release
              echo "::warning::main holds v$version, which is already released; testing only. Set a newer version on dev and merge it."
              release=false
            fi
            version=$next
          fi
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse "HEAD^{tree}")
          {
            echo "version=$version"
            echo "release=$release"
            echo "sha=$sha"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          if [ "$as_checked_out" = true ]; then
            echo "$tree $version" > tested-tree.txt
          fi
          echo "version $version at $sha (tree $tree); release: $release" | tee -a "$GITHUB_STEP_SUMMARY"

      # What this run builds, for a release to find (see the top); only kept
      # from runs that pass
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree
          path: tested-tree.txt
          if-no-files-found: ignore

  reuse:
    name: Find tested release binaries
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Look for a passed pull request run of this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ needs.version.outputs.tree }} ${{ needs.version.outputs.version }}
          # the test matrix (6) and the conda package matrix (5)
          JOBS: 11
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=50" --jq '.workflow_runs[].id')
          for id in $runs; do
            names=" $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            case "$names" in *" tested-tree "*) ;; *) continue ;; esac
            case "$names" in *" dist "*) ;; *) continue ;; esac
            # all six test jobs must have run and passed, not been skipped
            # all test and conda package jobs must have run and passed, not
            # been skipped
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("Test (") or startswith("Conda package (")) | select(.conclusion == "success")] | length')
            if [ "$passed" != "$JOBS" ]; then
              echo "run $id: $passed of $JOBS test and package jobs passed; not reusing it"
              continue
            fi
            rm -rf marker
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n tested-tree -D marker || continue
            if [ "$(cat marker/tested-tree.txt)" = "$WANT" ]; then
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              echo "Releasing the archives of run $id, which built and tested this tree." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No passed pull request run built this tree; building and testing it here." | tee -a "$GITHUB_STEP_SUMMARY"

  version-check:
    name: Version is unreleased
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request that changes anything outside exempt.txt must carry a
      # version newer than the latest release (CI bumps dev after each
      # release; for a minor or major release, set it by hand)
      - name: Check build.zig.zon's version against the latest tag
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t patterns < <(grep -v '^\s*#' .github/workflows/exempt.txt | grep -v '^\s*$')
          needs_version=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            exempt=false
            for pat in "${patterns[@]}"; do
              # shellcheck disable=SC2254
              case "$f" in $pat) exempt=true; break ;; esac
            done
            if [ "$exempt" = false ]; then needs_version=true; echo "changed: $f"; break; fi
          done <<< "$(git diff --name-only "$BASE_SHA...HEAD")"
          if [ "$needs_version" = false ]; then
            echo "Only exempt files changed; no version needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
          latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
          latest=${latest#v}
          if [ -z "$latest" ]; then
            echo "No release yet; v$version will be the first." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)
          if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
            echo "::error file=build.zig.zon::.version is $version, but v$latest is already released. Set it to a newer version (e.g. the next patch, minor or major)."
            exit 1
          fi
          echo "v$version is newer than the latest release v$latest." | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build release binaries
    needs: [version, reuse]
    # reuse is skipped unless releasing, and its failure only means building
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.reuse.outputs.run_id == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      # editors/vscode/schemas/fortls.schema.json is generated from
      # src/settings.zig
      - name: Configuration file schema is up to date
        run: python3 tools/gen_config_schema.py --check

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Source is formatted (zig fmt)
        run: zig fmt --check build.zig build.zig.zon src tests

      # Downloads (lazy ones too) are retried: a dropped connection to a
      # package host should not fail the run
      - name: Fetch dependencies
        run: |
          for wait in 15 30 60 120; do
            zig build --fetch=all && exit 0
            echo "::warning::fetching dependencies failed; retrying in ${wait}s"
            sleep "$wait"
          done
          zig build --fetch=all

      # Only differs from the checkout when the version is already released
      # (such a run is tested but not released)
      - name: Set version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed -i -E "s/^(\s*\.version = \")[^\"]+(\",)/\1$VERSION\2/" build.zig.zon

      - name: Cross-compile and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            # macOS 11 and later, rather than Zig's default minimum (15)
            case "$target" in
              *macos) zig_target="$target.11.0" ;;
              *) zig_target=$target ;;
            esac
            # the binary only (`bin`), without the API documentation
            zig build bin -Dtarget="$zig_target" -Doptimize=ReleaseSafe --prefix "out/$target"
            name="zfls-v$VERSION-$target"
            pkg="pkg/$name"
            mkdir -p "$pkg"
            # the binary (and its PDB on Windows), not zfls.prerelease
            for f in zfls zfls.exe zfls.pdb; do
              if [ -e "out/$target/bin/$f" ]; then cp "out/$target/bin/$f" "$pkg/"; fi
            done
            cp LICENSE "$pkg/"
            cp readme.md "$pkg/README.md"
            case "$target" in
              *windows) (cd pkg && zip -qr "../dist/$name.zip" "$name") ;;
              *) tar -C pkg -czf "dist/$name.tar.gz" "$name" ;;
            esac
          done
          # the sources, rstd included, for building from source (conda-forge)
          bash tools/make_source_archive.sh dist
          ls -l dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The VS Code extension, once per VS Code platform with the matching
      # zfls from dist/ in it, and once without one
      - name: Package the VS Code extension
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash tools/package_vscode.sh dist "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.target }})
    needs: [version, build]
    # explicit: a skipped job anywhere upstream (reuse, on pull requests)
    # would otherwise skip the tests too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux, vscode: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-linux, vscode: linux-arm64 }
          - { os: windows-2025, target: x86_64-windows, vscode: win32-x64 }
          - { os: windows-11-arm, target: aarch64-windows, vscode: win32-arm64 }
          - { os: macos-15-intel, target: x86_64-macos, vscode: darwin-x64 }
          - { os: macos-15, target: aarch64-macos, vscode: darwin-arm64 }
    env:
      FORTLS: ${{ github.workspace }}/_fortls
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      - name: Check out fortls (reference implementation and test corpus)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FORTLS_REPO }}
          ref: ${{ env.FORTLS_REF }}
          path: _fortls

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      # Downloads (lazy ones too) are retried: a dropped connection to a
      # package host should not fail the run
      - name: Fetch dependencies
        run: |
          for wait in 15 30 60 120; do
            zig build --fetch=all && exit 0
            echo "::warning::fetching dependencies failed; retrying in ${wait}s"
            sleep "$wait"
          done
          zig build --fetch=all

      # gfortran is the oracle for symbol extraction; the oracle test is
      # skipped where none is available (Windows on Arm)
      - name: gfortran (Linux)
        if: runner.os == 'Linux'
        run: command -v gfortran || (sudo apt-get update && sudo apt-get install -y gfortran)

      - name: gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          gf=$(ls "$(brew --prefix)"/bin/gfortran-* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$gf" ]; then
            brew install gcc
            gf=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$gf" "$RUNNER_TEMP/bin/gfortran"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: gfortran (Windows x64)
        if: matrix.target == 'x86_64-windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc-fortran
          path-type: inherit

      # The image has other, older GCC toolchains on PATH: name MSYS2's
      - name: Put gfortran on PATH (Windows x64)
        if: matrix.target == 'x86_64-windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION\\ucrt64\\bin" >> "$GITHUB_PATH"
          echo "GFORTRAN=$MSYS2_LOCATION\\ucrt64\\bin\\gfortran.exe" >> "$GITHUB_ENV"

      - name: Unit tests
        run: zig build test --summary failures

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Unpack the release binary as a release candidate
        run: |
          name="zfls-v$VERSION-$TARGET"
          mkdir -p shipped
          case "$TARGET" in
            *windows) python -m zipfile -e "dist/$name.zip" shipped ;;
            *) tar -C shipped -xzf "dist/$name.tar.gz" ;;
          esac
          if [ -e "shipped/$name/zfls.prerelease" ]; then
            echo "::error::release package $name contains zfls.prerelease"
            exit 1
          fi
          touch "shipped/$name/zfls.prerelease"
          exe=zfls
          case "$TARGET" in *windows) exe=zfls.exe ;; esac
          echo "ZFLS=$PWD/shipped/$name/$exe" >> "$GITHUB_ENV"

      - name: Version under test
        run: |
          got=$("$ZFLS" --version | tr -d '\r')
          echo "$got" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$got" != "$VERSION-rc" ]; then
            echo "::error::expected $VERSION-rc"
            exit 1
          fi

      - name: fortls test suite
        run: python tests/fortls_parity.py --zfls "$ZFLS" --fortls "$FORTLS"

      - name: gfortran oracle
        run: python tests/gfortran_oracle.py --zfls "$ZFLS"

      - name: Stress sessions
        run: |
          python tests/stress_edit.py --zfls "$ZFLS" --fortls "$FORTLS" --seeds 10 --steps 3000
          python tests/stress_edit.py --zfls "$ZFLS" --fortls "$FORTLS" --first-seed 200 --seeds 4 --steps 3000 --no-incremental
          python tests/stress_edit.py --zfls "$ZFLS" --fortls "$FORTLS" --first-seed 300 --seeds 4 --steps 3000 --preprocessor

      - name: Differential test against Python fortls
        run: python tests/differential.py --zfls "$ZFLS" --fortls "$FORTLS"

      - name: Version once released
        run: |
          rm "$(dirname "$ZFLS")/zfls.prerelease"
          got=$("$ZFLS" --version | tr -d '\r')
          if [ "$got" != "$VERSION" ]; then
            echo "::error::without zfls.prerelease, --version printed '$got', expected '$VERSION'"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: VS Code's libraries and a display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libsecret-1-0

      # This platform's VSIX, unpacked as VS Code would install it, run in a
      # downloaded VS Code: hover, definition, completion and symbols through
      # the extension's language client and its bundled zfls (after the unit
      # tests of the extension's helpers)
      - name: VS Code extension in VS Code
        env:
          VSIX: dist/zfls-vscode-v${{ needs.version.outputs.version }}-${{ matrix.vscode }}.vsix
        run: |
          python -m zipfile -e "$VSIX" "$RUNNER_TEMP/vsix"
          cd editors/vscode
          npm ci --no-audit --no-fund
          npm run typecheck
          # the helpers that need no VS Code (run, tools, linter), in plain Node.js
          npm run unit
          npm run build-test
          export ZFLS_EXTENSION_PATH="$RUNNER_TEMP/vsix/extension"
          run_vscode() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node out/runTest.js
            else
              node out/runTest.js
            fi
          }
          # a VS Code window that hangs while starting on the runner fails
          # the run before the test begins; a broken extension fails both
          if ! run_vscode; then
            echo "::warning::the VS Code test failed; running it once more"
            run_vscode
          fi

  conda:
    name: Conda package (${{ matrix.platform }})
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-64, rattler: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, rattler: aarch64-unknown-linux-musl }
          - { os: windows-2025, platform: win-64, rattler: x86_64-pc-windows-msvc.exe }
          - { os: macos-15-intel, platform: osx-64, rattler: x86_64-apple-darwin }
          - { os: macos-15, platform: osx-arm64, rattler: aarch64-apple-darwin }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RATTLER_BUILD_VERSION: v0.76.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install rattler-build
        env:
          ASSET: rattler-build-${{ matrix.rattler }}
        run: |
          dir="$RUNNER_TEMP/rattler-build"
          mkdir -p "$dir"
          exe="$dir/rattler-build"
          case "$ASSET" in *.exe) exe="$exe.exe" ;; esac
          curl -fsSL --retry 5 -o "$exe" "https://github.com/prefix-dev/rattler-build/releases/download/$RATTLER_BUILD_VERSION/$ASSET"
          chmod +x "$exe"
          echo "$dir" >> "$GITHUB_PATH"

      # The conda-forge recipe, built from this run's source archive with
      # conda-forge's zig; its tests check the installed zfls
      - name: Build and test the conda package
        run: |
          python packaging/conda-forge/local_recipe.py "dist/zfls-v$VERSION-src.tar.gz" "$RUNNER_TEMP/recipe"
          rattler-build build --recipe "$RUNNER_TEMP/recipe" -c conda-forge --output-dir "$RUNNER_TEMP/conda-out"

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, reuse, build, test, conda]
    # with archives a pull request run tested, or ones this run built and
    # tested on every platform
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true'
      && (needs.reuse.outputs.run_id != ''
      || (needs.build.result == 'success' && needs.test.result == 'success'
      && needs.conda.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check the archives
        run: |
          ls -l dist
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            if ! ls "dist/zfls-v$VERSION-$target".* >/dev/null 2>&1; then
              echo "::error::no archive for $target at version $VERSION"
              exit 1
            fi
          done
          if [ ! -f "dist/zfls-v$VERSION-src.tar.gz" ]; then
            echo "::error::no source archive at version $VERSION"
            exit 1
          fi
          for platform in win32-x64 win32-arm64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64 universal; do
            if [ ! -f "dist/zfls-vscode-v$VERSION-$platform.vsix" ]; then
              echo "::error::no VS Code extension for $platform at version $VERSION"
              exit 1
            fi
          done

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "zfls v$VERSION" "$SHA"
          git push origin "v$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: zfls v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not stop the publishing.
  begin-next-version:
    name: Merge v${{ needs.version.outputs.version }} into dev and begin the next version
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      # dev takes pushes only from pull requests whose checks pass, and from
      # this deploy key, which the dev ruleset lets bypass that (GITHUB_TOKEN
      # cannot be a bypass actor); without the secret the token is used
      DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # A fast-forward when dev has not moved, else a merge commit
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          push_to=origin
          if [ -n "$DEPLOY_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dev_deploy_key
            chmod 600 ~/.ssh/dev_deploy_key
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dev_deploy_key -o IdentitiesOnly=yes"
            push_to="git@github.com:$GITHUB_REPOSITORY.git"
          fi
          for attempt in 1 2 3; do
            git fetch -q origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -m "Merge v$VERSION into dev [skip ci]" "$SHA"; then
              git merge --abort
              echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
              exit 1
            fi
            version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              sed -i -E "s/^(\s*\.version = \")[^\"]+(\",)/\1$next\2/" build.zig.zon
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q "$push_to" dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1

  publish-extension:
    name: Publish VS Code extension v${{ needs.version.outputs.version }}
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    # Each registry has its own workflow, which takes the packages from the
    # release: open-vsx.yml, the workflow Open VSX trusts by name (trusted
    # publishing), and marketplace.yml, which signs in as the publisher's
    # managed identity. Both can also be run by hand for any released version.
    permissions:
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Start publishing to Open VSX and the Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in open-vsx.yml marketplace.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f version="$VERSION"
          done
